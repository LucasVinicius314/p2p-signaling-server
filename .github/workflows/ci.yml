name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26.x patch, not the 1.26.0 that go.mod names as a minimum: the standard library gets
          # security fixes in patch releases, and govulncheck below fails on a vulnerable toolchain.
          go-version: "1.26"
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: tests (with the race detector)
        run: go test -race -count=1 ./...
      - run: go build ./...

  mongo:
    # The store tests need a real MongoDB; they are behind the "mongo" build tag.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test -tags mongo -count=1 ./internal/store/mongo
        env:
          MONGODB_URI: mongodb://localhost:27017

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image CapRover builds
        run: docker build --pull -f deployments/Dockerfile -t p2p-signaling-server:ci .

  csharp-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build clients/godot-csharp/P2PSignaling.csproj -c Release
