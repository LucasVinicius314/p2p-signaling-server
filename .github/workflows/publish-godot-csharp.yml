name: publish-godot-csharp

# Push a tag like godot-csharp-v0.1.0 to publish the C# client to GitHub Packages.
on:
  push:
    tags: ["godot-csharp-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#godot-csharp-v}"
          dotnet pack clients/godot-csharp/P2PSignaling.csproj -c Release -p:Version="$VERSION" \
            -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" -o out
      - name: Push
        run: |
          dotnet nuget push "out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
